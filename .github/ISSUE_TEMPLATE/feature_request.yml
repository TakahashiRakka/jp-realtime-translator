name: 功能建议
description: 提出一个新功能或改进点子
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看看 [README 的路线图](https://github.com/TakahashiRakka/jp-realtime-translator#路线图)，
        说不定已经在计划里了。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述你遇到的痛点，而不是直接描述方案。
      placeholder: 看生放送时不知道哪句话是谁说的，字幕混在一起很难读。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
      description: 描述你设想的方案，越具体越好。
      placeholder: 增加说话人分离，用不同颜色区分不同角色的字幕。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 有没有别的做法？为什么你觉得上面那个更好？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪个部分
      options:
        - 音频采集 / 设备
        - 语音识别（ASR）
        - 翻译 / 语法解析
        - 界面（UI）
        - 导出 / 字幕
        - 配置 / 启动脚本
        - 文档
        - 其他 / 不确定
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提交 PR 来实现这个功能
        - label: 我愿意帮忙测试
        - label: 我只是提个想法
