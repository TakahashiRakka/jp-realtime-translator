name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke · Python ${{ matrix.python-version }} · Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-whisper.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall -q main.py asr.py audio_capture.py config.py translator.py patch_soundcard.py tests

      - name: soundcard compatibility patch (idempotent)
        run: python patch_soundcard.py

      - name: Smoke test (mock mode, no model / network / audio device needed)
        env:
          MOCK: "1"
        run: python tests/smoke_test.py
